name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - parallel:
          - name: Check for accidental secrets
            run: |
              secret_pattern='BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|glpat-[A-Za-z0-9_-]{20,}|(cfp_|cf_)[A-Za-z0-9_-]{20,}|npm_[A-Za-z0-9_-]{20,}|(CLOUDFLARE_API_TOKEN|CLOUDFLARE_API_KEY|CF_API_TOKEN)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{20,}|NPM_TOKEN[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_-]{20,}'
              if matches=$(git grep -l -I -E "$secret_pattern"); then
                echo "Potential credential material is tracked in:"
                echo "$matches"
                exit 1
              fi

          - name: "Lint: whitespace and package graph"
            run: git diff --check && swift package show-dependencies

          - name: Analyze the C HID bridge
            run: clang --analyze -Xanalyzer -analyzer-output=text -I Sources/CHIDBridge/include Sources/CHIDBridge/CHIDBridge.c

          - name: Test, build release, and run protocol assertions
            run: swift test && swift build -c release && swift run -c release protocol-check

  regression-baseline:
    name: Prove audit regressions on pre-fix baseline
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply regression tests to audited baseline
        run: |
          git diff e676e65555366958fa08e55d20d6681771e37e56 HEAD -- Tests/KeyboardCoreTests > "$RUNNER_TEMP/regressions.patch"
          git checkout --detach e676e65555366958fa08e55d20d6681771e37e56
          git apply "$RUNNER_TEMP/regressions.patch"
      - name: Confirm split-event and Unicode-name defects
        run: |
          swift build --build-tests
          for regression in splitCompletionAcrossPollsUpdatesLifecycleCache deviceNameRoundTripsUTF16 releasingOneChordKeyPreventsBothHold; do
            if swift test --skip-build --filter "$regression" > "$RUNNER_TEMP/$regression.log" 2>&1; then
              cat "$RUNNER_TEMP/$regression.log"
              echo "Expected baseline regression failure: $regression"
              exit 1
            fi
            cat "$RUNNER_TEMP/$regression.log"
            grep -q 'Expectation failed\|Caught error' "$RUNNER_TEMP/$regression.log"
          done
      - name: Upload baseline reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audit-baseline-regressions
          path: ${{ runner.temp }}/*.log
